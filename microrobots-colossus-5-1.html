<title>Microrobots: Colossus Engine</title>
<style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
// ---- perf ----
const PROF = {
    low: { pr: 1, shadow: 0, radius: 2, units: 2500 }, medium: { pr: 1.5, shadow: 1024, radius: 3, units: 4000 }, high: { pr: 2, shadow: 2048, radius: 5, units: 7000 }
};
// Resolução adaptativa: reduz a escala se o FPS cair; só sobe após período de espera (evita oscilação).
class Perf {
    constructor(onScale) {
        this.onScale = onScale;
        this.scale = 1;
        this.maxPR = 1.5;
        this.show = true;
        this.el = document.getElementById('perf');
        this.ms = 16;
        this.acc = 0;
        this.frames = 0;
        this.cool = 0;
    }
    tick(dt) {
        this.ms += (dt * 1000 - this.ms) * .05;
        this.acc += dt;
        this.frames++;
        if (this.acc < 1)
            return;
        const fps = this.frames / this.acc;
        this.cool = Math.max(0, this.cool - 1);
        if (fps < 26 && this.scale > .55) {
            this.scale = Math.max(.55, this.scale - .1);
            this.cool = 8;
            this.onScale();
        }
        else if (fps >= 57 && this.scale < 1 && this.cool === 0) {
            this.scale = Math.min(1, this.scale + .05);
            this.onScale();
        }
        if (this.show)
            this.el.textContent = `${Math.round(fps)} FPS  ${this.ms.toFixed(1)} ms  res ${Math.round(this.scale * 100)}%`;
        this.frames = 0;
        this.acc = 0;
    }
}

// ---- input ----
// Multitouch com Pointer Events: um ponteiro por zona (joystick à esquerda, câmera à direita).
class Input {
    get running() { return this.run || this.keys.has('ShiftLeft'); }
    constructor() {
        this.mx = 0;
        this.my = 0;
        this.lx = 0;
        this.ly = 0;
        this.jump = false;
        this.run = false;
        this.joyId = -1;
        this.keys = new Set();
        const $ = (id) => document.getElementById(id);
        const zl = $('zl'), zr = $('zr'), joy = $('joy'), knob = $('knob'), runB = $('run'), jumpB = $('jump');
        let ox = 0, oy = 0, cid = -1, px = 0, py = 0;
        const stick = (e) => {
            const R = joy.offsetWidth / 2;
            let dx = e.clientX - ox, dy = e.clientY - oy;
            const l = Math.hypot(dx, dy);
            if (l > R) {
                dx *= R / l;
                dy *= R / l;
            }
            knob.style.transform = `translate(${dx}px,${dy}px)`;
            const m = Math.min(l, R) / R;
            this.mx = m < .12 ? 0 : dx / R;
            this.my = m < .12 ? 0 : -dy / R;
        };
        const endJoy = (e) => { if (e.pointerId !== this.joyId)
            return; this.joyId = -1; this.mx = this.my = 0; joy.style.display = 'none'; knob.style.transform = ''; };
        zl.addEventListener('pointerdown', e => {
            if (this.joyId >= 0)
                return;
            this.joyId = e.pointerId;
            zl.setPointerCapture(e.pointerId);
            ox = e.clientX;
            oy = e.clientY;
            joy.style.display = 'block';
            joy.style.left = ox + 'px';
            joy.style.top = oy + 'px';
            stick(e);
        });
        zl.addEventListener('pointermove', e => { if (e.pointerId === this.joyId)
            stick(e); });
        zl.addEventListener('pointerup', endJoy);
        zl.addEventListener('pointercancel', endJoy);
        zr.addEventListener('pointerdown', e => { if (cid >= 0)
            return; cid = e.pointerId; zr.setPointerCapture(e.pointerId); px = e.clientX; py = e.clientY; });
        zr.addEventListener('pointermove', e => { if (e.pointerId !== cid)
            return; this.lx += e.clientX - px; this.ly += e.clientY - py; px = e.clientX; py = e.clientY; });
        const endCam = (e) => { if (e.pointerId === cid)
            cid = -1; };
        zr.addEventListener('pointerup', endCam);
        zr.addEventListener('pointercancel', endCam);
        jumpB.addEventListener('pointerdown', e => { e.preventDefault(); this.jump = true; });
        runB.addEventListener('click', () => { this.run = !this.run; runB.classList.toggle('on', this.run); });
        addEventListener('keydown', e => { this.keys.add(e.code); if (e.code === 'Space') {
            this.jump = true;
            e.preventDefault();
        } });
        addEventListener('keyup', e => this.keys.delete(e.code));
        addEventListener('blur', () => this.keys.clear());
    }
    poll() {
        if (this.joyId >= 0)
            return;
        const k = this.keys, x = (k.has('KeyD') ? 1 : 0) - (k.has('KeyA') ? 1 : 0), y = (k.has('KeyW') ? 1 : 0) - (k.has('KeyS') ? 1 : 0), l = Math.hypot(x, y) || 1;
        this.mx = x / l;
        this.my = y / l;
    }
}

// ---- world ----

const S = 64, STEP = .35, key = (x, z) => x + ',' + z;
const rng = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const hash = (x, z) => (Math.imul(x, 73856093) ^ Math.imul(z, 19349663)) >>> 0;
const cv = (n, f) => { const c = document.createElement('canvas'); c.width = c.height = n; f(c.getContext('2d'), n); return c; };
const tex = (c, srgb, an) => { const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = an; if (srgb)
    t.colorSpace = THREE.SRGBColorSpace; return t; };
const V = new THREE.Vector3(), Sc = new THREE.Vector3(), Q = new THREE.Quaternion(), M = new THREE.Matrix4(), C = new THREE.Color();
function plateMaps(an) {
    const r = rng(7);
    const col = cv(1024, (g, n) => {
        const p = n / 4;
        for (let i = 0; i < 16; i++) {
            const v = (r() * 26 - 13) | 0;
            g.fillStyle = `rgb(${112 + v},${118 + v},${125 + v})`;
            g.fillRect((i % 4) * p, (i >> 2) * p, p, p);
        }
        for (let i = 0; i < 6000; i++) {
            const l = r() < .5 ? 255 : 0;
            g.fillStyle = `rgba(${l},${l},${l},${r() * .07})`;
            g.fillRect(r() * n, r() * n, 30 + r() * 200, 1);
        }
        g.fillStyle = '#15191d';
        for (let k = 0; k <= 4; k++) {
            g.fillRect(k * p - 2, 0, 4, n);
            g.fillRect(0, k * p - 2, n, 4);
        }
        g.fillStyle = '#aab6be';
        for (let i = 0; i < 4; i++)
            for (let j = 0; j < 4; j++)
                for (const [a, b] of [[14, 14], [p - 14, 14], [14, p - 14], [p - 14, p - 14]]) {
                    g.beginPath();
                    g.arc(i * p + a, j * p + b, 3.5, 0, 6.283);
                    g.fill();
                }
    });
    const rough = cv(1024, (g, n) => {
        g.fillStyle = '#a6a6a6';
        g.fillRect(0, 0, n, n);
        for (let i = 0; i < 7000; i++) {
            const v = (120 + r() * 110) | 0;
            g.fillStyle = `rgba(${v},${v},${v},.5)`;
            g.fillRect(r() * n, r() * n, 20 + r() * 220, 1);
        }
        g.strokeStyle = '#4a4a4a';
        for (let i = 0; i < 60; i++) {
            const x = r() * n, y = r() * n, a = r() * 6.283, l = 20 + r() * 90;
            g.beginPath();
            g.moveTo(x, y);
            g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l);
            g.stroke();
        }
        g.fillStyle = '#fff';
        const p = n / 4;
        for (let k = 0; k <= 4; k++) {
            g.fillRect(k * p - 2, 0, 4, n);
            g.fillRect(0, k * p - 2, n, 4);
        }
    });
    return [tex(col, true, an), tex(rough, false, an)];
}
function wallMaps(an) {
    const r = rng(11);
    const col = cv(512, (g, n) => {
        g.fillStyle = '#59616a';
        g.fillRect(0, 0, n, n);
        for (let i = 0; i < 3000; i++) {
            const l = r() < .5 ? 255 : 0;
            g.fillStyle = `rgba(${l},${l},${l},${r() * .08})`;
            g.fillRect(r() * n, r() * n, 1, 20 + r() * 160);
        }
        g.fillStyle = '#1a1e22';
        for (let k = 0; k < 4; k++)
            g.fillRect(0, k * 128 - 1, n, 3);
    });
    const rough = cv(512, (g, n) => {
        g.fillStyle = '#989898';
        g.fillRect(0, 0, n, n);
        for (let i = 0; i < 3000; i++) {
            const v = (100 + r() * 130) | 0;
            g.fillStyle = `rgba(${v},${v},${v},.5)`;
            g.fillRect(r() * n, r() * n, 1, 20 + r() * 160);
        }
    });
    return [tex(col, true, an), tex(rough, false, an)];
}
class World {
    constructor(an) {
        this.root = new THREE.Group();
        this.radius = 3;
        this.sectors = new Map();
        this.cx = 1e9;
        this.cz = 1e9;
        this.plane = new THREE.PlaneGeometry(S, S).rotateX(-Math.PI / 2);
        this.cube = new THREE.BoxGeometry(1, 1, 1);
        const [fc, fr] = plateMaps(an), [wc, wr] = wallMaps(an);
        this.floorMat = new THREE.MeshStandardMaterial({ map: fc, roughnessMap: fr, roughness: 1, metalness: .85, envMapIntensity: .8 });
        this.wallMat = new THREE.MeshStandardMaterial({ map: wc, roughnessMap: wr, roughness: 1, metalness: .8, envMapIntensity: .8 });
    }
    get mats() { return [this.floorMat, this.wallMat]; }
    update(x, z) { const sx = Math.floor(x / S), sz = Math.floor(z / S); if (sx === this.cx && sz === this.cz)
        return; this.cx = sx; this.cz = sz; this.refresh(); }
    setRadius(r) { this.radius = r; this.refresh(); }
    refresh() {
        if (this.cx > 1e8)
            return;
        const R = this.radius;
        for (let dz = -R; dz <= R; dz++)
            for (let dx = -R; dx <= R; dx++) {
                const k = key(this.cx + dx, this.cz + dz);
                if (!this.sectors.has(k))
                    this.sectors.set(k, this.build(this.cx + dx, this.cz + dz));
            }
        for (const [k, s] of this.sectors)
            if (Math.abs(s.sx - this.cx) > R + 1 || Math.abs(s.sz - this.cz) > R + 1) {
                this.root.remove(s.group);
                s.group.traverse(o => { if (o.isInstancedMesh)
                    o.dispose(); });
                this.sectors.delete(k);
            }
    }
    build(sx, sz) {
        const g = new THREE.Group(), boxes = [], h = hash(sx, sz), r = rng(h);
        const ground = new THREE.Mesh(this.plane, this.floorMat);
        ground.position.set((sx + .5) * S, 0, (sz + .5) * S);
        ground.receiveShadow = true;
        g.add(ground);
        const spec = [];
        if (h % 13 === 0 && (sx || sz))
            spec.push([22 + r() * 20, 22 + r() * 20, 24 + r() * 16, 24 + r() * 16, 120 + r() * 120]); // megaestrutura
        const n = 2 + (r() * 7 | 0);
        for (let i = 0; i < n; i++) {
            const t = r(), x = r() * S, z = r() * S;
            if (t < .35)
                spec.push([x, z, 3 + r() * 6, 3 + r() * 6, 8 + r() * 40]);
            else if (t < .6) {
                const w = 1.4 + r() * 1.2;
                spec.push([x, z, w, w, 10 + r() * 26]);
            }
            else if (t < .8)
                spec.push([x, z, 6 + r() * 10, 6 + r() * 10, .5 + r() * 2.2]);
            else {
                const a = 16 + r() * 18, b = 1.6 + r() * 1.2;
                spec.push(r() < .5 ? [x, z, a, b, 5 + r() * 7] : [x, z, b, a, 5 + r() * 7]);
            }
        }
        const items = spec.filter(b => Math.hypot(sx * S + b[0], sz * S + b[1]) > 14); // área inicial livre
        if (items.length) {
            const m = new THREE.InstancedMesh(this.cube, this.wallMat, items.length);
            items.forEach((b, i) => {
                const wx = sx * S + b[0], wz = sz * S + b[1];
                m.setMatrixAt(i, M.compose(V.set(wx, b[4] / 2, wz), Q, Sc.set(b[2], b[4], b[3])));
                m.setColorAt(i, C.setHSL(.58, .04 + r() * .05, .55 + r() * .4));
                boxes.push({ minX: wx - b[2] / 2, maxX: wx + b[2] / 2, minZ: wz - b[3] / 2, maxZ: wz + b[3] / 2, maxY: b[4] });
            });
            m.castShadow = m.receiveShadow = true;
            g.add(m);
        }
        this.root.add(g);
        return { sx, sz, group: g, boxes };
    }
    near(x, z) {
        const sx = Math.floor(x / S), sz = Math.floor(z / S), out = [];
        for (let dz = -1; dz <= 1; dz++)
            for (let dx = -1; dx <= 1; dx++) {
                const s = this.sectors.get(key(sx + dx, sz + dz));
                if (s)
                    for (const b of s.boxes)
                        out.push(b);
            }
        return out;
    }
    resolve(p, r) {
        const bs = this.near(p.x, p.z);
        for (let it = 0; it < 2; it++)
            for (const b of bs) {
                if (b.maxY <= p.y + STEP)
                    continue;
                const qx = Math.max(b.minX, Math.min(p.x, b.maxX)), qz = Math.max(b.minZ, Math.min(p.z, b.maxZ)), dx = p.x - qx, dz = p.z - qz, d2 = dx * dx + dz * dz;
                if (d2 >= r * r)

                    p.x += dx * k;
                    p.z += dz * k;
                }
                else {
                    const l = p.x - b.minX, rr = b.maxX - p.x, t = p.z - b.minZ, u = b.maxZ - p.z, m = Math.min(l, rr, t, u);
                    if (m === l)
                        p.x = b.minX - r;
                    else if (m === rr)
                        p.x = b.maxX + r;
                    else if (m === t)
                        p.z = b.minZ - r;
                    else
                        p.z = b.maxZ + r;
                }
            }
    }
    inside(x, y, z) { for (const b of this.near(x, z))
        if (x > b.minX && x < b.maxX && z > b.minZ && z < b.maxZ && y > 0 && y < b.maxY)
            return true; return false; }
    groundAt(x, z, feetY, r) {
        let h = 0;
        for (const b of this.near(x, z))
            if (b.maxY <= feetY + STEP && b.maxY > h && x > b.minX - r && x < b.maxX + r && z > b.minZ - r && z < b.maxZ + r)

    }
    rayDist(o, d, maxT) {

            for (const [p, v, lo, hi] of ax) {
                if (Math.abs(v) < 1e-8) {
                    if (p < lo || p > hi) {
                        ok = false;
                        break;
                    }
                }
                else {
                    let a = (lo - p) / v, c = (hi - p) / v;
                    if (a > c) {
                        const s = a;
                        a = c;
                        c = s;
                    }
                    t0 = Math.max(t0, a);
                    t1 = Math.min(t1, c);
                    if (t0 > t1) {
                        ok = false;
                        break;
                    }
                }
            }
            if (ok && t0 < best)
                best = t0;
        }
        return best;
    }
}

// ---- player ----

const R = .35, G = -24, WALK = 3.6, RUN = 7.2, JUMP = 8.5;
const mat = (c, m, r, e = 0) => new THREE.MeshStandardMaterial({ color: c, metalness: m, roughness: r, emissive: e, emissiveIntensity: e ? 1.6 : 0 });
class Player {
    constructor(w) {
        this.w = w;
        this.group = new THREE.Group();
        this.pos = new THREE.Vector3();
        this.vel = new THREE.Vector3();
        this.yaw = 0;
        this.ground = true;
        this.flying = false;
        this.landing = false;
        this.boost = false;
        this.vert = 0; // voo: controlado pelo poder FlightPower
        this.phase = 0;
        this.amp = 0;
        this.coyote = 0;
        this.buf = 0;
        this.dip = 0;
        this.up = 0;
        this.fp = 0;
        this.tt = 0;
        this.legs = [];
        this.arms = [];
        this.group.rotation.order = 'YXZ';
        const suit = mat(0x242b32, .35, .6), trim = mat(0x8fa2ae, .8, .35), glow = mat(0x0a1a22, 0, .4, 0x6fd3ff);

    }
    world.update(player.pos.x, player.pos.z);
    sun.position.copy(player.pos).addScaledVector(sunDir, 120);
    sun.target.position.copy(player.pos);
    sky.position.copy(camera.position);
    hud();
    renderer.render(scene, camera);
    perf.tick(dt);
});

</script></body></html>
